<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ultra Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --surface: #0f0f17; --surface-r: #141420;
      --border: #1e1e2e; --border-s: #2e2e45;
      --text: #e5e7eb; --text-m: #6b7280; --text-d: #4b5563;
      --accent: #f59e0b; --accent-bg: #1a1000; --accent-bd: #78350f; --accent-dim: #92400e;
      --success: #22c55e; --success-bg: #052e16; --success-bd: #14532d;
      --danger: #ef4444; --danger-bg: #1c0a0a; --danger-bd: #7f1d1d;
      --warning: #fbbf24; --warn-bg: #1a1000; --warn-bd: #92400e;
      --info: #60a5fa; --info-bg: #0c1a30; --info-bd: #1e3a5f;
      --log-bg: #050508; --log-ts: #f59e0b; --log-src: #9ca3af; --log-text: #d1d5db;
      --mono: 'JetBrains Mono', monospace; --sans: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      display: flex;
      height: 100vh;
      overflow: hidden;
      align-items: center;
      justify-content: center;
    }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 8px; border-radius: 2px; border: 1px solid; font-family: var(--mono); }
    .badge-running { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-bd); }
    .badge-pushed { color: var(--success); background: var(--success-bg); border-color: var(--success-bd); }
    .badge-danger { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-bd); }
    .badge-warning { color: var(--warning); background: var(--warn-bg); border-color: var(--warn-bd); }
    .badge-info { color: var(--info); background: var(--info-bg); border-color: var(--info-bd); }
    .badge-muted { color: var(--text-m); background: var(--surface-r); border-color: var(--border); }
    .btn { font-family: var(--mono); font-size: 11px; padding: 6px 14px; border-radius: 2px; cursor: pointer; font-weight: 500; border: 1px solid; }
    .btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
    .btn-secondary { background: transparent; color: var(--text-m); border-color: var(--border-s); }
    input[type=text], input[type=password], textarea, select {
      background: var(--surface-r);
      border: 1px solid var(--border-s);
      border-radius: 2px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      width: 100%;
    }
    input[type=text]:focus, input[type=password]:focus, textarea:focus, select:focus {
      border-color: var(--accent-bd);
    }
    label { font-size: 11px; color: var(--text-m); display: block; margin-bottom: 4px; }

    /* Login-specific */
    .login-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 32px 28px 28px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 11px;
      color: var(--text-d);
      letter-spacing: .04em;
    }

    .login-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .login-field {
      margin-bottom: 20px;
    }

    .login-actions {
      margin-top: 4px;
    }

    .btn-login {
      width: 100%;
      padding: 9px 14px;
      font-size: 12px;
      font-family: var(--mono);
      font-weight: 700;
      background: var(--accent);
      color: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: .04em;
    }

    .btn-login:hover {
      background: #d97706;
      border-color: #d97706;
    }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 10px;
      color: var(--text-d);
      letter-spacing: .04em;
    }

    .login-footer span {
      color: var(--border-s);
    }

    /* Ambient grid lines for depth */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245, 158, 11, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand">◆ WORKSHOP</div>
        <div class="login-subtitle">Ultra Workshop Control Panel</div>
      </div>
      <hr class="login-divider">
      <div class="login-field">
        <label for="token">Access token</label>
        <input type="password" id="token" placeholder="sk-workshop-••••••••••••••••" autocomplete="current-password">
      </div>
      <div class="login-actions">
        <button class="btn-login" type="button">Login</button>
      </div>
    </div>
    <div class="login-footer">
      <span>ultra-workshop</span> &nbsp;·&nbsp; v0.1.0
    </div>
  </div>

</body>
</html>
