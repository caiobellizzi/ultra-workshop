model:
  default: "private-worker"
  provider: "custom"
  base_url: "http://127.0.0.1:4000/v1"
  api_key: "${LITELLM_API_KEY}"

agent:
  max_turns: 50

approvals:
  mode: smart

clarify:
  timeout: 300

mcp_servers: {}

# HITL restart-resilience hook (REQ-ws-014)
# Deployed to: /home/uws/.hermes/hooks/startup-hitl-scan/
#   HOOK.yaml  — declares event: gateway:startup
#   handler.py — imports /opt/ultra-workshop/hermes-skills/startup-hitl-scan.py
# pending_hitl.db: /home/uws/.ultra-workshop/pending_hitl.db (uws:uws 0600)
# Hook is auto-discovered from ~/.hermes/hooks/ on gateway start.

platforms:
  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    allow_from:
      - "7113965359"
